# Pages placed under these sections will be shown on homepage and archive page.
mainSections = ["post"]
# Output page's full content in RSS.
rssFullContent = true
favicon        = "" # icons are generated from assets/img/favicon.jpg in head/custom.html
description    = "Daniel Bonam's blog on software engineering, test automation, AI and smart cities."

# Accepted values: "default", "lastmod"
# default = see https://gohugo.io/quick-reference/glossary/#default-sort-order
# lastmod = sort by last modified date, in descending order
SortBy              = "default"

[footer]
    since      = 2025
    customText = ""

[dateFormat]
    published   = ":date_full"
    lastUpdated = ":date_full"

[sidebar]
    emoji    = ""
    subtitle = "Software engineer writing about tech stuff"
    avatar   = "img/avatar.png"

[article]
    headingAnchor = false
    math          = false
    readingTime   = true

    [article.license]
        enabled = false

[widgets]
    homepage = [
        { type = "search" },
        { type = "archives", params = { limit = 5 } },
        { type = "categories", params = { limit = 10 } },
        { type = "tag-cloud", params = { limit = 10 } },
    ]
    page = [{ type = "toc" }]

[opengraph.twitter]
    site = ""
    card = "summary_large_image"

[colorScheme]
    toggle  = true
    default = "dark"

## Comments
[comments]
    enabled = false

# Used for structured data (JSON-LD)
[author]
    name   = "Daniel Bonam Rissardi"
    url    = "https://bonam.cc/about/"
    sameAs = ["https://github.com/B0nam", "https://medium.com/@danibonam"]
